<div class="card h-100 shadow-sm border rounded-3 overflow-hidden bg-white">
  <img 
    [src]="producto().imagen" 
    class="card-img-top object-fit-contain p-3 bg-white border-bottom" 
    style="height: 180px; width: 100%;" 
    [alt]="producto().nombre">
  
  <div class="card-body d-flex flex-column p-3">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="badge bg-light text-secondary border fw-normal">{{ producto().categoria }}</span>
      <span class="badge rounded-pill fw-normal px-2 py-1" 
            [class]="producto().stock > 0 ? 'bg-success-subtle text-success border border-success-subtle' : 'bg-danger-subtle text-danger border border-danger-subtle'">
        {{ producto().stock > 0 ? 'Disponibles: ' + producto().stock : 'Agotado' }}
      </span>
    </div>

    <h6 class="card-title fw-bold text-dark mb-1">{{ producto().nombre }}</h6>
    <p class="fs-5 fw-bold text-dark font-monospace mb-3">
      {{ producto().precio | currency:'BOB ':'symbol':'1.2-2' }}
    </p>

    <button 
      class="btn btn-dark btn-sm w-100 mt-auto py-2 fw-medium" 
      [disabled]="producto().stock === 0"
      (click)="onPedir()">
      {{ producto().stock > 0 ? 'Pedir producto' : 'Sin stock' }}
    </button>
  </div>
  
</div>
